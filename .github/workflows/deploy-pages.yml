name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Project sites are served from /<repo>/, so the build needs the base path.
  # `basePathRewrite` in astro.config.mjs then prefixes the root-absolute URLs
  # authored in components and markdown.
  GH_PAGES_BASE: /devil-ui
  SITE_URL: https://hellwrk.github.io

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Built with plain package scripts rather than `vp run build:docs`: the
      # Vite+ task cache is keyed on inputs, not env, so a concurrently warmed
      # entry (built without GH_PAGES_BASE) would be replayed verbatim.
      - name: Build devil-ui
        run: pnpm --filter @hellwrk/devil-ui build

      - name: Build docs
        run: pnpm --filter @cloudflare/kumo-docs-astro build

      - name: Verify base path was applied
        run: |
          if ! grep -q "/devil-ui/_astro/" packages/kumo-docs-astro/dist/index.html; then
            echo "::error::Built HTML is missing the /devil-ui base path"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/kumo-docs-astro/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
