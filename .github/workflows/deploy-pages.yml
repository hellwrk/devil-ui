name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - uses: ./.github/actions/vite-task-cache

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Project sites live under /<repo>/, so the site is built with a base
      # path. `basePathRewrite` in astro.config.mjs then prefixes the
      # root-absolute URLs authored in components and markdown.
      - name: Build docs
        env:
          GH_PAGES_BASE: /devil-ui
          SITE_URL: https://hellwrk.github.io
        run: vp run build:docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/kumo-docs-astro/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
